<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Glowing Upward Trend Arrow -->
  <g filter="url(#glow)">
    <path d="M130 360 L230 250 L300 290 L390 170" stroke="url(#acc)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arrow Head -->
    <path d="M300 170 L390 170 L390 260" stroke="url(#acc)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>